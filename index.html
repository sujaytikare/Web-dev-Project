<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="main-box">
    <h1>Attendance Calculator</h1>
    <p class="intro">Enter your class details below to check your attendance.</p>

    <label for="totalClasses">Total classes</label>
    <input type="number" id="totalClasses" placeholder="Example: 40">

    <label for="attendedClasses">Classes attended</label>
    <input type="number" id="attendedClasses" placeholder="Example: 32">

    <label for="targetPercent">Required attendance percentage</label>
    <input type="number" id="targetPercent" value="75">

    <button onclick="calculateAttendance()">Calculate</button>
    <button class="clear-button" onclick="clearForm()">Clear</button>

    <div id="result" class="result-box">
      Your result will show here.
    </div>

    <div class="formula-box">
      <h2>Formula Used</h2>
      <p>Attendance percentage = attended classes / total classes x 100</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
